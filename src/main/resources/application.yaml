spring:
  application:
    name: coffe-prince
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
        # 컬렉션(Order.items 등) 지연 로딩 시 IN 절로 묶어 조회해 N+1 방지
        default_batch_fetch_size: 100
  jackson:
    mapper:
      allow-coercion-of-scalars: false
