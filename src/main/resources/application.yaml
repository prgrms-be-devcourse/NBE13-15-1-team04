spring:
  application:
    name: coffe-prince
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
        # 컬렉션(Order.items 등) 지연 로딩 시 IN 절로 묶어 조회해 N+1 방지
        default_batch_fetch_size: 100
  jackson:
    mapper:
      allow-coercion-of-scalars: false

# 선택 심화: RestClient 외부 게시글 조회 대상 주소 (환경 변수 REFERENCE_BASE_URL 로 변경 가능)
reference:
  base-url: ${REFERENCE_BASE_URL:https://jsonplaceholder.typicode.com}
