# 기본 문구
jakarta.validation.constraints.NotNull.message=필수 값입니다.
jakarta.validation.constraints.NotBlank.message=값을 입력해 주세요.
jakarta.validation.constraints.Positive.message=1 이상의 정수여야 합니다.
jakarta.validation.constraints.Size.message={max}자 이하여야 합니다.
jakarta.validation.constraints.Max.message={value} 이하여야 합니다.
jakarta.validation.constraints.PastOrPresent.message=오늘 또는 그 이전 날짜여야 합니다.
# 키별 문구 설정
Size.trimmed=앞뒤 공백을 제외하고 {max}자 이하여야 합니다.
NotNull.onlyTrueFalse=true 또는 false로 입력해 주세요.
