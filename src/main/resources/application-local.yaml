spring:
  config:
    # 없으면 아래 기본값 사용
    import: "optional:file:./local.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/coffeprince}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      # DB 가 아직 안 떠 있으면 이 시간(ms) 동안 재시도 후 실패
      initialization-fail-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    # Hibernate 가 테이블을 만든 뒤에 init.sql 실행 (CREATE TABLE IF NOT EXISTS 라 건너뛰고 초기 데이터만 적재)
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:db/init.sql
      encoding: UTF-8
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis 는 캐시로만 사용 (Redis Repository 스캔 끔)
      repositories:
        enabled: false

# A06 메뉴 조회 Redis 캐시 스위치 (기본 켬 → Redis 실행 필요: docker compose up -d redis)
# Redis 없이 실행하려면 local.env 에 CACHE_ENABLED=false 추가
app:
  cache:
    enabled: ${CACHE_ENABLED:true}
    menus-ttl-seconds: 60
