services:
  mysql:
    image: mysql:8.0
    container_name: coffeprince-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: coffeprince
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql

  # A06 메뉴 조회 캐시용 (CACHE_ENABLED 기본 켬 → 앱 실행 전에 띄워 두기)
  redis:
    image: redis:7
    container_name: coffeprince-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mysql-data:
