services:
  mysql:
    image: mysql:8.0
    container_name: coffeprince-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: coffeprince
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      # 카테고리명 중복·메뉴명 검색·이메일 비교가 대소문자를 구분하도록 DB 기본 콜레이션을 utf8mb4_bin 으로 통일
      - --collation-server=utf8mb4_bin
    volumes:
      - mysql-data:/var/lib/mysql

  # A06 메뉴 조회 캐시용 (CACHE_ENABLED 기본 켬 → 앱 실행 전에 띄워 두기)
  redis:
    image: redis:7
    container_name: coffeprince-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mysql-data:
